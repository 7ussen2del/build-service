# React builds produce static assets, so the image serves them instead of
# running the application's own process. run_command is therefore NOT used
# by this template (open decision #3 in the plan; revisit if the Application
# Service starts sending a meaningful command for react apps).
name: react
version: v1
base_image: node:20-alpine
variables:
  source_directory:
    kind: repo_dir
    required: true
  port:
    kind: port
    required: true
