services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: build_service
      POSTGRES_USER: build
      POSTGRES_PASSWORD: build
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  celery:
    build: .
    command: celery -A config worker -Q build -l info
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

  # Local build executor. The mounted Docker socket gives Jenkins control of the
  # host daemon (needed for docker build/push) -- that is host-root-equivalent
  # access, so this arrangement is for local testing only, never production.
  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  jenkins_home:
